<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #faf9f6;
  --surface: #f4f2ee;
  --border: #e8e4dd;
  --text-primary: #1a1917;
  --text-secondary: #6b6760;
  --text-muted: #9e9b96;
  --accent: #C49A2A;
  --accent-hover: #A8831F;
  --accent-text: #ffffff;
  --destructive: #c0392b;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 2px 8px rgba(0,0,0,0.04);
  --success: #27ae60;
}

[data-theme="dark"] {
  --bg: #141412;
  --surface: #1e1c1a;
  --border: #2e2b27;
  --text-primary: #f0ede8;
  --text-secondary: #9e9b96;
  --text-muted: #6b6760;
  --accent: #D4A835;
  --accent-hover: #C49A2A;
  --accent-text: #ffffff;
  --shadow: 0 1px 3px rgba(0,0,0,0.3), 0 2px 8px rgba(0,0,0,0.2);
  --success: #2ecc71;
}

html, body {
  height: 100%;
  font-family: 'Lora', serif;
  font-size: 15px;
  line-height: 1.6;
  color: var(--text-primary);
  background: var(--bg);
  transition: background 0.15s ease, color 0.15s ease;
}

/* Header */
.header {

  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  z-index: 100;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.header-brand {
  font-family: 'DM Sans', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--accent);
  text-decoration: none;
  letter-spacing: -0.01em;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
}

.btn {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  font-weight: 500;
  border: none;
  cursor: pointer;
  border-radius: 8px;
  padding: 8px 16px;
  transition: all 0.15s ease;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-secondary {
  background: var(--surface);
  color: var(--text-primary);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: var(--accent); }

.btn-primary {
  background: var(--accent);
  color: var(--accent-text);
}
.btn-primary:hover { background: var(--accent-hover); }

#btn-new-image { display: none; }

.theme-toggle {
  width: 36px;
  height: 36px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  color: var(--text-secondary);
  font-size: 16px;
}
.theme-toggle:hover { border-color: var(--accent); }

/* Main area */
.main {
  margin-top: 52px;
  height: calc(100vh - 52px - 32px);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* Drop zone */
.drop-zone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 100%;
  max-width: 560px;
  padding: 64px 32px;
  border: 2px dashed var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.15s ease;
  text-align: center;
}
.drop-zone:hover, .drop-zone.drag-over {
  border-color: var(--accent);
  background: rgba(196, 154, 42, 0.04);
}
[data-theme="dark"] .drop-zone:hover,
[data-theme="dark"] .drop-zone.drag-over {
  background: rgba(212, 168, 53, 0.06);
}

.drop-zone-icon {
  width: 64px;
  height: 64px;
  margin-bottom: 20px;

}

.drop-zone-text {
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  color: var(--text-secondary);
  margin-bottom: 8px;
}

.drop-zone-sub {
  font-family: 'DM Sans', sans-serif;
  font-size: 13px;
  color: var(--text-muted);
}

.file-input { display: none; }

/* Status bar */
.status-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  background: var(--surface);
  border-top: 1px solid var(--border);
  font-family: 'DM Sans', sans-serif;
  font-size: 12px;
  color: var(--text-muted);
  z-index: 100;
  transition: background 0.15s ease, border-color 0.15s ease;
}

.status-left { display: flex; align-items: center; gap: 4px; }
.status-right { display: flex; align-items: center; gap: 4px; }

/* Badge */
.badge {
  position: fixed;
  bottom: 40px;
  right: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 11px;
  color: var(--text-muted);
  z-index: 90;
  text-decoration: none;
  transition: color 0.15s ease;
}
.badge:hover { color: var(--accent); }

/* Toast */
.toast-container {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 200;
  display: flex;
  flex-direction: column;

.toast {
  font-family: 'DM Sans', sans-serif;

  border-radius: 8px;
  background: var(--text-primary);
  color: var(--bg);
  box-shadow: var(--shadow);
  opacity: 0;
  transform: translateY(10px);
  animation: toastIn 0.2s ease forwards;
  pointer-events: auto;
}
.toast.out { animation: toastOut 0.2s ease forwards; }
@keyframes toastIn { to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-10px); } }

/* Editor */
.editor {
  display: none;
  width: 100%;
  height: 100%;
  flex-direction: column;
}
.editor.active { display: flex; }
.drop-zone.hidden { display: none; }

.image-info-bar {
  display: flex;

  min-height: 36px;
  transition: background 0.15s ease, border-color 0.15s ease;
}
.image-info-bar .filename {
  color: var(--text-secondary);
  font-weight: 500;
  max-width: 300px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.image-info-bar .sep { color: var(--border); }

.canvas-area {
  flex: 1;
  background: #1a1917;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}

.canvas-wrapper {
  position: relative;
  line-height: 0;
}

.canvas-wrapper canvas {
  display: block;
}

@media (max-width: 768px) {
  .drop-zone {
    max-width: 90%;
    padding: 48px 24px;
  }
}

<script>
// ── State ──
var originalImage = null;
var originalFileInfo = null;
var displayScale = 1;
var cropRect = { x: 0, y: 0, width: 0, height: 0 };
var isMobile = window.matchMedia('(max-width: 768px)').matches;
var HANDLE_SIZE = isMobile ? 20 : 8;
var MIN_CROP = 10;

// Drag state
var dragMode = null;   // 'move', 'draw', 'nw','n','ne','e','se','s','sw','w'
var dragStartX = 0;
var dragStartY = 0;
var dragStartCrop = null;

// ── DOM refs ──
var dropZone = document.getElementById('drop-zone');
var fileInput = document.getElementById('file-input');
var editor = document.getElementById('editor');
var btnNewImage = document.getElementById('btn-new-image');
var canvasArea = document.getElementById('canvas-area');
var canvasWrapper = document.getElementById('canvas-wrapper');
var imageCanvas = document.getElementById('image-canvas');
var overlayCanvas = document.getElementById('overlay-canvas');
var statusLeft = document.getElementById('status-left');

// ── Theme ──
(function() {
  var toggle = document.getElementById('theme-toggle');
  var saved = localStorage.getItem('suite_theme');
  if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
    document.documentElement.setAttribute('data-theme', 'dark');
    toggle.textContent = '🌙';
  }
  toggle.addEventListener('click', function() {
    var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    if (isDark) {
      document.documentElement.removeAttribute('data-theme');
      localStorage.setItem('suite_theme', 'light');
      toggle.textContent = '☀️';
    } else {
      document.documentElement.setAttribute('data-theme', 'dark');
      localStorage.setItem('suite_theme', 'dark');
      toggle.textContent = '🌙';
    }
  });
})();

// ── Toast ──
function showToast(msg, duration) {
  duration = duration || 3000;
  var container = document.getElementById('toast-container');
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  container.appendChild(el);
  setTimeout(function() {
    el.classList.add('out');
    setTimeout(function() { el.remove(); }, 200);
  }, duration);
}

// ── Helpers ──
function formatBytes(bytes) {
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

function getFormatLabel(mimeType) {
  var map = {
    'image/jpeg': 'JPG', 'image/png': 'PNG', 'image/webp': 'WebP',
    'image/gif': 'GIF', 'image/bmp': 'BMP', 'image/svg+xml': 'SVG'
  };
  return map[mimeType] || mimeType.split('/')[1].toUpperCase();
}

// ── Show editor ──
function showEditor() {
  dropZone.classList.add('hidden');
  editor.classList.add('active');
  btnNewImage.style.display = '';
}

// ── Return to drop zone ──
function resetToDropZone() {
  editor.classList.remove('active');
  dropZone.classList.remove('hidden');
  btnNewImage.style.display = 'none';
  statusLeft.textContent = 'Ready';
  if (originalImage) { originalImage.src = ''; originalImage = null; }
  originalFileInfo = null;
  displayScale = 1;
  cropRect = { x: 0, y: 0, width: 0, height: 0 };
  imageCanvas.width = 0; imageCanvas.height = 0;
  overlayCanvas.width = 0; overlayCanvas.height = 0;
}

// ── Draw image on canvas ──
function drawImageToCanvas() {
  if (!originalImage) return;

  var areaW = canvasArea.clientWidth - 40;
  var areaH = canvasArea.clientHeight - 40;
  var natW = originalImage.naturalWidth;
  var natH = originalImage.naturalHeight;

  var oldScale = displayScale;
  displayScale = Math.min(1, areaW / natW, areaH / natH);
  var dw = Math.round(natW * displayScale);
  var dh = Math.round(natH * displayScale);

  // Rescale crop rect if canvas size changed
  if (oldScale > 0 && oldScale !== displayScale && cropRect.width > 0) {
    var ratio = displayScale / oldScale;
    cropRect.x = Math.round(cropRect.x * ratio);
    cropRect.y = Math.round(cropRect.y * ratio);
    cropRect.width = Math.round(cropRect.width * ratio);
    cropRect.height = Math.round(cropRect.height * ratio);
  }

  imageCanvas.width = dw;
  imageCanvas.height = dh;
  overlayCanvas.width = dw;
  overlayCanvas.height = dh;
  canvasWrapper.style.width = dw + 'px';
  canvasWrapper.style.height = dh + 'px';

  var ctx = imageCanvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(originalImage, 0, 0, dw, dh);

  drawOverlay();
}

// ── Set default crop (80% centered) ──
function setDefaultCrop() {
  var w = imageCanvas.width;
  var h = imageCanvas.height;
  var cw = Math.round(w * 0.8);
  var ch = Math.round(h * 0.8);
  cropRect.x = Math.round((w - cw) / 2);
  cropRect.y = Math.round((h - ch) / 2);
  cropRect.width = cw;
  cropRect.height = ch;
}

// ── Clamp crop to image bounds ──
function clampCrop() {
  var w = imageCanvas.width;
  var h = imageCanvas.height;
  if (cropRect.width < MIN_CROP) cropRect.width = MIN_CROP;
  if (cropRect.height < MIN_CROP) cropRect.height = MIN_CROP;
  if (cropRect.width > w) cropRect.width = w;
  if (cropRect.height > h) cropRect.height = h;
  if (cropRect.x < 0) cropRect.x = 0;
  if (cropRect.y < 0) cropRect.y = 0;
  if (cropRect.x + cropRect.width > w) cropRect.x = w - cropRect.width;
  if (cropRect.y + cropRect.height > h) cropRect.y = h - cropRect.height;
}

// ── Draw overlay ──
function drawOverlay() {
  var ctx = overlayCanvas.getContext('2d');
  var w = overlayCanvas.width;
  var h = overlayCanvas.height;
  ctx.clearRect(0, 0, w, h);

  if (cropRect.width <= 0 || cropRect.height <= 0) return;

  var cx = cropRect.x, cy = cropRect.y, cw = cropRect.width, ch = cropRect.height;

  // Dim outside crop
  ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
  ctx.fillRect(0, 0, w, cy);                          // top
  ctx.fillRect(0, cy, cx, ch);                         // left
  ctx.fillRect(cx + cw, cy, w - cx - cw, ch);         // right
  ctx.fillRect(0, cy + ch, w, h - cy - ch);           // bottom

  // Crop border
  ctx.strokeStyle = '#C49A2A';
  ctx.lineWidth = 2;
  ctx.strokeRect(cx, cy, cw, ch);

  // Handles
  var hs = HANDLE_SIZE;
  var hh = hs / 2;
  var handles = getHandlePositions();
  for (var i = 0; i < handles.length; i++) {
    var hp = handles[i];
    ctx.fillStyle = '#C49A2A';
    ctx.fillRect(hp.x - hh, hp.y - hh, hs, hs);
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(hp.x - hh, hp.y - hh, hs, hs);
  }

  updateCropStatus();
}

// ── Handle positions ──
function getHandlePositions() {
  var cx = cropRect.x, cy = cropRect.y, cw = cropRect.width, ch = cropRect.height;
  return [
    { id: 'nw', x: cx,          y: cy },
    { id: 'n',  x: cx + cw / 2, y: cy },
    { id: 'ne', x: cx + cw,     y: cy },
    { id: 'e',  x: cx + cw,     y: cy + ch / 2 },
    { id: 'se', x: cx + cw,     y: cy + ch },
    { id: 's',  x: cx + cw / 2, y: cy + ch },
    { id: 'sw', x: cx,          y: cy + ch },
    { id: 'w',  x: cx,          y: cy + ch / 2 }
  ];
}

// ── Hit test: which handle or region is under (mx, my)? ──
function hitTest(mx, my) {
  var hs = HANDLE_SIZE + 4; // slightly larger hit area
  var hh = hs / 2;
  var handles = getHandlePositions();
  for (var i = 0; i < handles.length; i++) {
    var hp = handles[i];
    if (mx >= hp.x - hh && mx <= hp.x + hh && my >= hp.y - hh && my <= hp.y + hh) {
      return hp.id;
    }
  }
  // Inside crop?
  if (mx >= cropRect.x && mx <= cropRect.x + cropRect.width &&
      my >= cropRect.y && my <= cropRect.y + cropRect.height) {
    return 'move';
  }
  // Outside crop on image = draw new
  return 'draw';
}

// ── Cursor for handle ──
var cursorMap = {
  nw: 'nw-resize', n: 'n-resize', ne: 'ne-resize', e: 'e-resize',
  se: 'se-resize', s: 's-resize', sw: 'sw-resize', w: 'w-resize',
  move: 'move', draw: 'crosshair'
};

// ── Get mouse/touch position relative to overlay canvas ──
function getPos(e) {
  var rect = overlayCanvas.getBoundingClientRect();
  var clientX, clientY;
  if (e.touches && e.touches.length > 0) {
    clientX = e.touches[0].clientX;
    clientY = e.touches[0].clientY;
  } else if (e.changedTouches && e.changedTouches.length > 0) {
    clientX = e.changedTouches[0].clientX;
    clientY = e.changedTouches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return {
    x: clientX - rect.left,
    y: clientY - rect.top
  };
}

// ── Update status bar with crop dimensions ──
function updateCropStatus() {
  if (!originalImage || cropRect.width <= 0) {
    statusLeft.textContent = 'Ready';
    return;
  }
  var realW = Math.round(cropRect.width / displayScale);
  var realH = Math.round(cropRect.height / displayScale);
  statusLeft.textContent = 'Crop: ' + realW + ' \u00d7 ' + realH + ' px';
}

// ── Mouse / touch handlers ──
function onPointerDown(e) {
  if (!originalImage) return;
  e.preventDefault();
  var pos = getPos(e);
  var hit = hitTest(pos.x, pos.y);

  dragMode = hit;
  dragStartX = pos.x;
  dragStartY = pos.y;
  dragStartCrop = { x: cropRect.x, y: cropRect.y, width: cropRect.width, height: cropRect.height };

  if (hit === 'draw') {
    cropRect.x = pos.x;
    cropRect.y = pos.y;
    cropRect.width = 0;
    cropRect.height = 0;
  }
}

function onPointerMove(e) {
  if (!originalImage) return;
  var pos = getPos(e);

  if (!dragMode) {
    // Just update cursor
    var hit = hitTest(pos.x, pos.y);
    overlayCanvas.style.cursor = cursorMap[hit] || 'crosshair';
    return;
  }

  e.preventDefault();
  var dx = pos.x - dragStartX;
  var dy = pos.y - dragStartY;
  var sc = dragStartCrop;
  var W = imageCanvas.width;
  var H = imageCanvas.height;

  if (dragMode === 'move') {
    cropRect.x = sc.x + dx;
    cropRect.y = sc.y + dy;
    cropRect.width = sc.width;
    cropRect.height = sc.height;
    // Keep in bounds
    if (cropRect.x < 0) cropRect.x = 0;
    if (cropRect.y < 0) cropRect.y = 0;
    if (cropRect.x + cropRect.width > W) cropRect.x = W - cropRect.width;
    if (cropRect.y + cropRect.height > H) cropRect.y = H - cropRect.height;

  } else if (dragMode === 'draw') {
    var x1 = dragStartX, y1 = dragStartY;
    var x2 = pos.x, y2 = pos.y;
    // Clamp to canvas
    x2 = Math.max(0, Math.min(W, x2));
    y2 = Math.max(0, Math.min(H, y2));
    cropRect.x = Math.min(x1, x2);
    cropRect.y = Math.min(y1, y2);
    cropRect.width = Math.abs(x2 - x1);
    cropRect.height = Math.abs(y2 - y1);

  } else {
    // Resize from handle
    var newX = sc.x, newY = sc.y, newW = sc.width, newH = sc.height;

    if (dragMode.indexOf('w') !== -1) {
      newX = sc.x + dx;
      newW = sc.width - dx;
    }
    if (dragMode.indexOf('e') !== -1) {
      newW = sc.width + dx;
    }
    if (dragMode === 'n' || dragMode === 'nw' || dragMode === 'ne') {
      newY = sc.y + dy;
      newH = sc.height - dy;
    }
    if (dragMode === 's' || dragMode === 'sw' || dragMode === 'se') {
      newH = sc.height + dy;
    }

    // If width flipped, constrain to minimum
    if (newW < MIN_CROP) {
      if (dragMode.indexOf('w') !== -1) {
        newX = sc.x + sc.width - MIN_CROP;
      }
      newW = MIN_CROP;
    }
    if (newH < MIN_CROP) {
      if (dragMode === 'n' || dragMode === 'nw' || dragMode === 'ne') {
        newY = sc.y + sc.height - MIN_CROP;
      }
      newH = MIN_CROP;
    }

    // Clamp to bounds
    if (newX < 0) { newW += newX; newX = 0; }
    if (newY < 0) { newH += newY; newY = 0; }
    if (newX + newW > W) newW = W - newX;
    if (newY + newH > H) newH = H - newY;
    if (newW < MIN_CROP) newW = MIN_CROP;
    if (newH < MIN_CROP) newH = MIN_CROP;

    cropRect.x = newX;
    cropRect.y = newY;
    cropRect.width = newW;
    cropRect.height = newH;
  }

  drawOverlay();
}

function onPointerUp(e) {
  if (!dragMode) return;
  // Enforce minimum after draw
  if (cropRect.width < MIN_CROP || cropRect.height < MIN_CROP) {
    if (dragMode === 'draw') {
      // Too small, reset to default
      setDefaultCrop();
    }
  }
  clampCrop();
  dragMode = null;
  drawOverlay();
}

// Mouse events
overlayCanvas.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);

// Touch events
overlayCanvas.addEventListener('touchstart', onPointerDown, { passive: false });
window.addEventListener('touchmove', function(e) {
  if (dragMode) onPointerMove(e);
}, { passive: false });
window.addEventListener('touchend', onPointerUp);

// ── Update info bar ──
function updateInfoBar(file) {
  document.getElementById('info-filename').textContent = file.name;
  document.getElementById('info-dimensions').textContent =
    originalImage.naturalWidth + ' \u00d7 ' + originalImage.naturalHeight;
  document.getElementById('info-filesize').textContent = formatBytes(file.size);
  document.getElementById('info-format').textContent = getFormatLabel(file.type);
}

// ── Handle file ──
function handleFile(file) {
  if (!file.type.startsWith('image/')) {
    showToast('Only image files are supported.');
    return;
  }
  if (file.size > 50 * 1024 * 1024) {
    showToast('File is too large. Maximum size is 50MB.');
    return;
  }
  if (file.size > 30 * 1024 * 1024) {
    showToast('Large image \u2014 may be slow to process', 4000);
  }

  var reader = new FileReader();
  reader.onload = function(e) {
    var img = new Image();
    img.onload = function() {
      originalImage = img;
      originalFileInfo = {
        name: file.name, size: file.size, type: file.type,
        width: img.naturalWidth, height: img.naturalHeight
      };

      showEditor();
      updateInfoBar(file);
      drawImageToCanvas();
      setDefaultCrop();
      clampCrop();
      drawOverlay();
    };
    img.onerror = function() { showToast('Could not load this image.'); };
    img.src = e.target.result;
  };
  reader.onerror = function() { showToast('Could not load this image.'); };
  reader.readAsDataURL(file);
}

// ── Drop zone events ──
dropZone.addEventListener('click', function() { fileInput.click(); });
dropZone.addEventListener('dragover', function(e) {
  e.preventDefault(); dropZone.classList.add('drag-over');
});
dropZone.addEventListener('dragleave', function() { dropZone.classList.remove('drag-over'); });
dropZone.addEventListener('drop', function(e) {
  e.preventDefault(); dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
});
fileInput.addEventListener('change', function() {
  if (fileInput.files.length > 0) handleFile(fileInput.files[0]);
  fileInput.value = '';
});

// ── New Image button ──
btnNewImage.addEventListener('click', resetToDropZone);

// ── Resize handling ──
window.addEventListener('resize', function() {
  isMobile = window.matchMedia('(max-width: 768px)').matches;
  HANDLE_SIZE = isMobile ? 20 : 8;
  if (originalImage) drawImageToCanvas();
});
</script>

</body>
</html>
